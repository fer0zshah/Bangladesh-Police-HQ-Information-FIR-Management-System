
<div id="erd" style="padding: 8px 0;"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#2a2a3a' : '#E6F1FB',
    primaryBorderColor: dark ? '#4a4a6a' : '#378ADD',
    primaryTextColor: dark ? '#c2c0b6' : '#0C447C',
    secondaryColor: dark ? '#1e2a1e' : '#EAF3DE',
    secondaryBorderColor: dark ? '#3a5a3a' : '#3B6D11',
    secondaryTextColor: dark ? '#b0c8b0' : '#27500A',
    tertiaryColor: dark ? '#2a1e2a' : '#EEEDFE',
    tertiaryBorderColor: dark ? '#5a3a6a' : '#534AB7',
    tertiaryTextColor: dark ? '#c0a8d0' : '#3C3489',
  },
  themeCSS: dark ? '' : `
    #erd svg text,
    #erd svg .nodeLabel,
    #erd svg .edgeLabel,
    #erd svg .label,
    #erd svg .labelText {
      fill: #1f2937 !important;
      color: #1f2937 !important;
    }
  `,
});
const diagramSource = `erDiagram
  STATION {
    int station_id PK
    string name
    string district
    string address
    string contact_number
    string status
  }

  USER {
    int id PK
    string name
    string email
    string phone
    string role
    string password
  }

  OFFICER {
    int officer_id PK
    int user_id FK
    int station_id FK
    string name
    string badge_number
    string rank
    string status
    boolean is_oc
  }

  CITIZEN_COMPLAINT {
    int complaint_id PK
    int station_id FK
    string complainant_name
    string complainant_nid
    string description
    date submitted_date
    string status
  }

  CASE_FIR {
    int case_id PK
    int station_id FK
    int investigating_officer_id FK
    int complaint_id FK
    string case_title
    date date_filed
    string status
  }

  CRIMINAL {
    int criminal_id PK
    string nid_number
    string name
    string alias
    date date_of_birth
    boolean wanted_status
  }

  CASE_CRIMINAL {
    int involvement_id PK
    int case_id FK
    int criminal_id FK
    string involvement_type
  }

  EVIDENCE {
    int evidence_id PK
    int case_id FK
    int officer_id FK
    string type
    string description
    date collected_date
  }

  USER ||--o| OFFICER : "authenticates"
  STATION ||--o{ OFFICER : "employs"
  STATION ||--o{ CITIZEN_COMPLAINT : "receives"
  STATION ||--o{ CASE_FIR : "registers"
  OFFICER ||--o{ CASE_FIR : "investigates"
  CITIZEN_COMPLAINT ||--o| CASE_FIR : "escalates to"
  CASE_FIR ||--o{ CASE_CRIMINAL : "involves"
  CRIMINAL ||--o{ CASE_CRIMINAL : "linked in"
  CASE_FIR ||--o{ EVIDENCE : "has"
  OFFICER ||--o{ EVIDENCE : "collects"
`;
const { svg } = await mermaid.render('erd-svg', diagramSource);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
